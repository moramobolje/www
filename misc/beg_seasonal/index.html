<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sezonski Red Letenja - Aerodrom Beograd</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Overpass+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="beg_seasonal.css">
</head>
<body>

    <div class="container">
        <!-- Header Card -->
        <div class="header-card">
            <div class="header-main">
                <div class="brand">
                    <div class="logo-sq">
                        <i class="fa-solid fa-plane"></i>
                    </div>
                    <div class="title-group">
                        <h1 class="main-title">BELGRADE <span class="light">AIRPORT</span></h1>
                        <p class="data-info">DATA FROM: <span id="snap-date">-- --- ---- @ --:--</span></p>
                    </div>
                </div>

                <div class="header-center">
                    <h2 id="page-title" class="mode-title">DEPARTURES</h2>
                </div>

                <div class="actions">
                    <div id="nav-container" class="nav-links">
                        <button id="nav-toggle" class="nav-btn" onclick="toggleMode()">ARRIVALS</button>
                    </div>
                </div>
            </div>
            
            <div class="alert-bar">
                <i class="fa-solid fa-circle-info"></i>
                <p>This is unofficial (hobby) page. Data source: Belgrade Airport. Please visit <a href="https://beg.aero" target="_blank" class="beg-link"><strong>https://beg.aero</strong></a> for official flight data.</p>
            </div>
        </div>

        <div id="timetable-container" class="timetable-main">
            <div class="loader">Učitavanje podataka...</div>
        </div>
    </div>

    <script src="beg_seasonal.js"></script>
</body>
</html>
